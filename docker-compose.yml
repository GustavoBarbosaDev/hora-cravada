services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: hora
      POSTGRES_PASSWORD: hora
      POSTGRES_DB: hora_cravada
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hora -d hora_cravada"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment: &backend-env
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://hora_app:hora_app@db:5432/hora_cravada
      MIGRATION_DATABASE_URL: postgresql+asyncpg://hora:hora@db:5432/hora_cravada
      JWT_SECRET: segredo-de-desenvolvimento-local
      TEST_DATABASE_URL: postgresql+asyncpg://hora:hora@db:5432/hora_cravada_test
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: arq app.worker.settings.WorkerSettings
    environment: *backend-env
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build: ./frontend
    command: npm run dev
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

volumes:
  pgdata:
